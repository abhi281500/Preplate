version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: preplate-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - preplate-mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=preplate
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - preplate-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: preplate-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=/api/v1
      - MONGODB_URI=mongodb://mongodb:27017/preplate
      - CLIENT_ORIGIN=http://localhost:3000
      - JWT_SECRET=preplate-production-secret-change-in-production
      - JWT_EXPIRES_IN=7d
      - SUPERADMIN_EMAIL=superadmin@preplate.io
      - SUPERADMIN_PASSWORD=Admin@Preplate2026!
      - SUPERADMIN_NAME=Platform Super Administrator
      - WHATSAPP_INTEGRATION_MODE=CLICK_TO_CHAT
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - preplate-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: preplate-web
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - preplate-net

volumes:
  preplate-mongo-data:
    driver: local

networks:
  preplate-net:
    driver: bridge
